{% load static %}  <!-- Carga los archivos estáticos -->

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Contraseña Restablecida</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      /* Imagen de fondo */
      background-image: url("{% static 'img/logos_o_otros/ombu_fondo.jpg' %}");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }
    .message-box {
      background-color: rgba(255, 255, 255, 0.92); /* Fondo semi-transparente */
      padding: 30px 40px;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
      max-width: 500px;
      width: 100%;
      text-align: center;
      backdrop-filter: blur(3px); /* Efecto vidrio */
    }
    h2 {
      color: #215733;
      margin-bottom: 20px;
    }
    p {
      color: #444;
      font-size: 1.1em;
      margin-bottom: 25px;
    }
    a {
      display: inline-block;
      margin-top: 10px;
      text-decoration: none;
      background-color: #215733;
      color: white;
      padding: 12px 30px;
      border-radius: 6px;
      font-weight: bold;
      transition: all 0.3s ease;
    }
    a:hover {
      background-color: #2e7d32;
      transform: translateY(-3px);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }
  </style>
</head>
<body>
  <div class="message-box">
    <h2>¡Contraseña cambiada con éxito!</h2>
    <p>Ahora puedes iniciar sesión con tu nueva contraseña.</p>
    <a href="{% url 'login' %}">Iniciar sesión</a>
  </div>
</body>
</html>
