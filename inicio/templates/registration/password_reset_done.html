<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Correo Enviado</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background-image: url('/static/img/logos_o_otros/ombu_fondo.jpg') !important;
      background-size: cover;
      background-position: center;
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .message-box {
      background-color: rgba(255, 255, 255, 0.9); /* Fondo semitransparente */
      padding: 40px 50px;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      max-width: 500px;
      width: 100%;
      text-align: center;
      backdrop-filter: blur(6px); /* efecto tipo glassmorphism */
    }

    h2 {
      color: #183D3D;
      margin-bottom: 20px;
      font-weight: 600;
      font-size: 1.8em;
    }

    p {
      color: #2e2e2e;
      font-size: 1.1em;
      margin-bottom: 20px;
    }

    a {
      display: inline-block;
      margin-top: 20px;
      text-decoration: none;
      background-color: #183D3D;
      color: white;
      padding: 12px 25px;
      border-radius: 8px;
      font-weight: 500;
      transition: background-color 0.3s ease;
    }

    a:hover {
      background-color: #145C5C;
    }
  </style>
</head>
<body>
  <div class="message-box">
    <h2>Revisa tu correo electrónico</h2>
    <p>Te hemos enviado un enlace para restablecer tu contraseña. Sigue las instrucciones del mensaje para continuar con el proceso.</p>
    <a href="/">Volver al inicio</a>
  </div>
</body>
</html>
